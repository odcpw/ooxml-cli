[package]
name = "ooxml-cli-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde = "1"
serde_json = "1"
ooxml-cli = { path = ".." }

[profile.release]
debug = 1
overflow-checks = true

[[bin]]
name = "build-spec"
path = "fuzz_targets/build_spec.rs"
test = false
doc = false
bench = false

[[bin]]
name = "markdown"
path = "fuzz_targets/markdown.rs"
test = false
doc = false
bench = false

[[bin]]
name = "brand"
path = "fuzz_targets/brand.rs"
test = false
doc = false
bench = false

[[bin]]
name = "refs"
path = "fuzz_targets/refs.rs"
test = false
doc = false
bench = false

[[bin]]
name = "image"
path = "fuzz_targets/image.rs"
test = false
doc = false
bench = false

[workspace]
