name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  rust-beta-clippy:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust beta
        uses: dtolnay/rust-toolchain@beta
        with:
          components: clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check upcoming Clippy lint drift
        run: cargo clippy --all-targets -- -D warnings

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Run CI gate
        run: make check-ci

      - name: Require zero Linux mutation proof gaps
        run: cargo test --lib linux_proof_matrix_has_zero_gaps_for_all_152_mutations -- --nocapture

      - name: Upload release trace and from-scratch recipe outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-proof-outputs
          path: |
            testdata/golden/release-real-file-traces.json
            testdata/golden/release-real-file-traces.actual
            target/ooxml-from-scratch-recipes/**
            target/ooxml-recipe-e2e/**
          if-no-files-found: warn
          retention-days: 14

  openxml-sdk-schema-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OOXML_REQUIRE_OPENXML_SDK: "1"

    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Cache Open XML SDK NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-openxml-sdk-${{ hashFiles('tools/openxml-validator/openxml-validator.csproj') }}
          restore-keys: |
            ${{ runner.os }}-openxml-sdk-

      - name: Build Open XML SDK validator
        run: |
          dotnet restore tools/openxml-validator/openxml-validator.csproj
          dotnet build tools/openxml-validator/openxml-validator.csproj --configuration Release --no-restore

      - name: Run Linux Open XML SDK schema gate
        run: cargo test --test openxml_sdk_gate -- --nocapture

  rust-cross-platform:
    name: Rust compile (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Compile all Rust targets
        run: cargo check --all-targets

      - name: Run full portable Rust test gate
        run: cargo test --all-targets

  office-schema-conformance-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Build Rust CLI
        run: cargo build --bin ooxml

      - name: Test PowerShell failure formatters
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tools\windows-office-edit-smoke.ps1 -TestFailureFormatter
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tools\windows-office-vba-smoke.ps1 -TestFailureFormatter

      - name: Generate all-command mutation proof artifacts
        shell: pwsh
        run: |
          $targetDir = (cargo metadata --format-version 1 --no-deps | ConvertFrom-Json).target_directory
          $env:OOXML_CONTRACT_PROOF_DIR = Join-Path $targetDir "ooxml-mutation-contract-proof"
          cargo test --test mutation_envelope -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Office schema/conformance smoke
        shell: pwsh
        run: |
          $targetDir = (cargo metadata --format-version 1 --no-deps | ConvertFrom-Json).target_directory
          $debugBin = Join-Path $targetDir "debug\ooxml.exe"
          $proofEvidenceDir = Join-Path $targetDir "ooxml-mutation-contract-proof\evidence"
          powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File .\tools\windows-office-edit-smoke.ps1 `
            -RepoRoot . `
            -BinaryPath $debugBin `
            -SkipBuild `
            -MutationParallelism 4 `
            -ContractEvidenceDir $proofEvidenceDir `
            -RequireOpenXmlSdk `
            -RunConformance `
            -SkipOffice `
            -WriteArtifactProofMatrix `
            -FailOnArtifactProofGap

      - name: Upload Office proof diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: office-schema-conformance-diagnostics
          path: |
            target/ooxml-office-edit-smoke/summary.json
            target/ooxml-office-edit-smoke/artifact-proof-matrix.json
            target/ooxml-office-edit-smoke/artifact-proof-matrix.md
            target/ooxml-office-edit-smoke/failed-outputs/**
          if-no-files-found: warn
          retention-days: 14
